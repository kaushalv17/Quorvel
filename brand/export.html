<!doctype html><html><head><meta charset="utf-8"><title>Quorvel plane export</title>
<style>body{font-family:Segoe UI,Arial,sans-serif;background:#0f0f14;color:#eee;text-align:center;padding:28px}.row{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;margin-top:16px}.card{background:#1a1a22;border:1px solid #2a2a35;border-radius:14px;padding:16px}a.dl{display:inline-block;margin-top:10px;padding:9px 14px;background:#3a7bff;color:#fff;border-radius:8px;text-decoration:none;font-size:14px}canvas{border-radius:12px}</style></head>
<body><h1>Quorvel — plane brand export</h1><p>Click to download, then in Clerk use Logo + Favicon &rarr; Replace image.</p><div class="row" id="out"></div>
<script>
const PLANE=`<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><rect width="512" height="512" rx="116" fill="#fbf3e2"/><g transform="translate(96 96) scale(5)"><path d="M4 30 L60 6 L40 58 L31 40 Z" fill="#3a7bff" stroke="#241f1a" stroke-width="3" stroke-linejoin="round"/><path d="M60 6 L31 40 L40 58 Z" fill="#2a5fd6" stroke="#241f1a" stroke-width="3" stroke-linejoin="round"/><path d="M4 30 L31 40 L60 6" fill="none" stroke="#241f1a" stroke-width="3" stroke-linejoin="round"/></g></svg>`;
function make(svg,w,h,name,label){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');const img=new Image();const b=new Blob([svg],{type:'image/svg+xml'});const u=URL.createObjectURL(b);img.onload=function(){x.drawImage(img,0,0,w,h);URL.revokeObjectURL(u);const card=document.createElement('div');card.className='card';card.appendChild(c);card.appendChild(document.createElement('br'));const a=document.createElement('a');a.className='dl';a.textContent='Download '+label;a.download=name;a.href=c.toDataURL('image/png');card.appendChild(a);document.getElementById('out').appendChild(card);};img.src=u;}
make(PLANE,512,512,'quorvel-plane-512.png','logo 512');
make(PLANE,64,64,'quorvel-plane-64.png','favicon 64');
</script></body></html>
